services:
  postgres:
    image: postgres:16-alpine
    container_name: mapt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mapt
      POSTGRES_USER: mapt
      POSTGRES_PASSWORD: mapt_db_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapt -d mapt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mapt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: mapt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://192.168.224.245:3128}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://192.168.224.245:3128}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,192.168.224.236,192.168.224.245,192.168.224.0/20,mapt.local,backend,caddy,frontend,postgres,redis,minio}
    container_name: mapt-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: mapt
      POSTGRES_PASSWORD: mapt_db_pass_2026
      POSTGRES_DB: mapt
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: mapt-packages
      MINIO_SECURE: "False"
      SECRET_KEY: ${SECRET_KEY:-mapt_super_secret_jwt_key_for_development_change_in_production_2026}
      DEFAULT_ENROLLMENT_TOKEN: ${DEFAULT_ENROLLMENT_TOKEN:-mapt-enroll-secret-token-2026}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin123!}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@mapt.local}
      WOL_RELAY_HOST: ${WOL_RELAY_HOST:-172.18.0.1}
      WOL_RELAY_PORT: ${WOL_RELAY_PORT:-9009}
    volumes:
      - ../agent:/agent:ro
    ports:
      - "8000:8000"

  wol-relay:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://192.168.224.245:3128}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://192.168.224.245:3128}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,192.168.224.236,192.168.224.245,192.168.224.0/20,mapt.local,backend,caddy,frontend,postgres,redis,minio}
    container_name: mapt-wol-relay
    restart: unless-stopped
    network_mode: host
    command: python -m app.services.wol_relay

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://192.168.224.245:3128}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://192.168.224.245:3128}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,192.168.224.236,192.168.224.245,192.168.224.0/20,mapt.local,backend,caddy,frontend,postgres,redis,minio}
    container_name: mapt-worker
    restart: unless-stopped
    command: python -m app.workers.deployment_worker
    depends_on:
      - backend
      - postgres
      - redis
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: mapt
      POSTGRES_PASSWORD: mapt_db_pass_2026
      POSTGRES_DB: mapt
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-mapt_super_secret_jwt_key_for_development_change_in_production_2026}
      DEFAULT_ENROLLMENT_TOKEN: ${DEFAULT_ENROLLMENT_TOKEN:-mapt-enroll-secret-token-2026}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin123!}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@mapt.local}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mapt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
